<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimony Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #ffffff;
            font-family: 'Arial', sans-serif;
            flex-direction: column;
            gap: 30px;
        }

        .timer-display {
            font-size: 180px;
            font-weight: bold;
            color: #003da5;
            text-shadow: none;
            font-variant-numeric: tabular-nums;
            letter-spacing: 10px;
            font-family: 'Courier New', monospace;
        }

        .timer-display.warning {
            color: #ff8c00;
            text-shadow: none;
        }

        .timer-display.danger {
            color: #ff0000;
            text-shadow: none;
        }

        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .time-input {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="number"] {
            width: 100px;
            padding: 10px;
            font-size: 18px;
            border: 2px solid #003da5;
            background: #ffffff;
            color: #003da5;
            border-radius: 5px;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #0052cc;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn-start {
            background: #003da5;
            color: #fff;
        }

        .btn-start:hover {
            background: #0052cc;
            transform: scale(1.05);
        }

        .btn-pause {
            background: #ff8c00;
            color: #fff;
        }

        .btn-pause:hover {
            background: #ff7700;
            transform: scale(1.05);
        }

        .btn-reset {
            background: #ff0000;
            color: #fff;
        }

        .btn-reset:hover {
            background: #cc0000;
            transform: scale(1.05);
        }

        .label {
            color: #333;
            font-size: 14px;
            text-transform: uppercase;
        }

        .timer-controls {
            display: flex;
            gap: 15px;
        }

        .mode-select {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .mode-btn {
            padding: 10px 20px;
            font-size: 14px;
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: #003da5;
            color: #fff;
            border-color: #003da5;
        }

        .mode-btn:hover {
            border-color: #003da5;
        }
    </style>
</head>
<body>
    <div class="mode-select">
        <button class="mode-btn active" onclick="setMode('timer')">Countdown</button>
        <button class="mode-btn" onclick="setMode('stopwatch')">Stopwatch</button>
    </div>

    <div class="timer-display" id="display">00:00</div>

    <div class="controls">
        <div class="time-input">
            <label class="label">Minutes:</label>
            <input type="number" id="minutes" min="0" max="59" value="5">
            <label class="label">Seconds:</label>
            <input type="number" id="seconds" min="0" max="59" value="0">
        </div>

        <div class="timer-controls">
            <button class="btn-start" id="startBtn" onclick="startTimer()">Start</button>
            <button class="btn-pause" id="pauseBtn" onclick="pauseTimer()" style="display:none;">Pause</button>
            <button class="btn-reset" onclick="resetTimer()">Reset</button>
        </div>
    </div>

    <script>
        let timeRemaining = 300; // 5 minutes default
        let isRunning = false;
        let intervalId = null;
        let mode = 'timer';

        const WARN_TIME = 30;
        const DANGER_TIME = 10;

        function setMode(newMode) {
            mode = newMode;
            resetTimer();
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function updateDisplay() {
            const mins = Math.floor(timeRemaining / 60);
            const secs = timeRemaining % 60;
            const display = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            document.getElementById('display').textContent = display;

            const displayEl = document.getElementById('display');
            displayEl.classList.remove('warning', 'danger');

            if (mode === 'timer') {
                if (timeRemaining <= DANGER_TIME) {
                    displayEl.classList.add('danger');
                } else if (timeRemaining <= WARN_TIME) {
                    displayEl.classList.add('warning');
                }
            }
        }

        function startTimer() {
            if (isRunning) return;

            if (!isRunning && timeRemaining === 0) {
                const mins = parseInt(document.getElementById('minutes').value) || 0;
                const secs = parseInt(document.getElementById('seconds').value) || 0;
                timeRemaining = mins * 60 + secs;
            }

            if (timeRemaining <= 0) return;

            isRunning = true;
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('pauseBtn').style.display = 'block';
            document.getElementById('minutes').disabled = true;
            document.getElementById('seconds').disabled = true;

            intervalId = setInterval(() => {
                if (mode === 'timer') {
                    timeRemaining--;
                    if (timeRemaining < 0) {
                        timeRemaining = 0;
                        pauseTimer();
                    }
                } else {
                    timeRemaining++;
                }
                updateDisplay();
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(intervalId);
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('pauseBtn').style.display = 'none';
            document.getElementById('minutes').disabled = false;
            document.getElementById('seconds').disabled = false;
        }

        function resetTimer() {
            pauseTimer();
            const mins = parseInt(document.getElementById('minutes').value) || 0;
            const secs = parseInt(document.getElementById('seconds').value) || 0;
            timeRemaining = mins * 60 + secs;
            updateDisplay();
        }

        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
